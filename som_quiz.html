<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Organizing Map Quiz</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.quiz-container{
    width:100%;
    max-width:750px;
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}
h1{text-align:center;margin-top:0;color:#1e293b}
.subtitle{text-align:center;color:#64748b;margin-bottom:25px}
.progress{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:25px}
.progress-bar{height:100%;width:0%;background:#4f46e5;transition:width .3s}
.question-number{font-weight:bold;color:#4f46e5;margin-bottom:10px}
.question{font-size:21px;font-weight:bold;color:#1e293b;margin-bottom:20px;line-height:1.5}
.option{
    width:100%;padding:15px;margin:10px 0;border:2px solid #e2e8f0;
    background:white;border-radius:12px;text-align:left;font-size:16px;
    cursor:pointer;transition:.2s;
}
.option:hover{border-color:#6366f1;background:#eef2ff}
.option:disabled{cursor:default}
.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#166534}
.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b}
.feedback{
    display:none;margin-top:20px;padding:18px;border-radius:12px;
    background:#f1f5f9;line-height:1.6;
}
.feedback.show{display:block}
.answer-title{font-weight:bold;margin-bottom:8px}
.buttons{display:flex;gap:12px;margin-top:25px}
.action{
    flex:1;padding:14px;border:none;border-radius:10px;
    font-size:16px;font-weight:bold;cursor:pointer;
}
#nextBtn{background:#4f46e5;color:white;display:none}
#restartBtn{background:#64748b;color:white;display:none}
.result{display:none;text-align:center}
.result h2{color:#1e293b;font-size:28px}
.score{font-size:45px;font-weight:bold;color:#4f46e5;margin:20px}
.result-message{color:#475569;font-size:18px;margin-bottom:25px}
@media(max-width:500px){
    .quiz-container{padding:20px}
    .question{font-size:18px}
    .option{font-size:15px}
}
</style>
</head>

<body>
<div class="quiz-container">
    <h1>Self-Organizing Map Quiz</h1>
    <div class="subtitle">Click an answer to reveal the correct answer and explanation.</div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="quizArea">
        <div class="question-number" id="questionNumber"></div>
        <div class="question" id="question"></div>
        <div id="options"></div>

        <div class="feedback" id="feedback">
            <div class="answer-title" id="answerTitle"></div>
            <div id="explanation"></div>
        </div>

        <div class="buttons">
            <button class="action" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
        </div>
    </div>

    <div class="result" id="result">
        <h2>Quiz Completed!</h2>
        <div class="score" id="score"></div>
        <div class="result-message" id="resultMessage"></div>
        <button class="action" id="restartBtn" onclick="restartQuiz()">Restart Quiz</button>
    </div>
</div>

<script>
const quiz = [
{
 question:"What type of neural network is a Self-Organizing Map (SOM)?",
 options:["Unsupervised neural network","Supervised neural network","Reinforcement learning network","Rule-based expert system"],
 answer:0,
 explanation:"SOM is an unsupervised neural network because it learns patterns and relationships from input data without requiring target labels."
},
{
 question:"What is the main purpose of a Self-Organizing Map?",
 options:["Discover patterns and clusters in data","Generate labeled training data","Calculate only classification accuracy","Replace all input features with one feature"],
 answer:0,
 explanation:"SOM is mainly used to discover patterns, similarities, clusters, and relationships in multidimensional data."
},
{
 question:"What does BMU stand for in SOM?",
 options:["Best Matching Unit","Binary Mapping Unit","Basic Memory Unit","Boundary Matching Unit"],
 answer:0,
 explanation:"BMU stands for Best Matching Unit. It is the neuron whose weight vector is most similar to the current input vector."
},
{
 question:"During SOM training, what happens to the BMU and its neighboring neurons?",
 options:["Their weights are adjusted toward the input","Their weights are permanently set to zero","They are removed from the map","Only the input data is modified"],
 answer:0,
 explanation:"The BMU and its neighboring neurons update their weights toward the current input vector."
},
{
 question:"Which distance measure is commonly used to identify the BMU for numerical SOM input?",
 options:["Euclidean distance","Edit distance","Hamming distance only","String distance"],
 answer:0,
 explanation:"Euclidean distance is commonly used to measure the difference between an input vector and the weight vectors of SOM neurons."
},
{
 question:"What is the role of the learning rate in SOM training?",
 options:["Controls the size of weight updates","Determines the number of input features","Selects the number of classes","Measures classification accuracy"],
 answer:0,
 explanation:"The learning rate controls how strongly the neuron weights are changed during each training update."
},
{
 question:"Why does SOM use a neighborhood function?",
 options:["To update nearby neurons along with the BMU","To remove all neighboring neurons","To create labeled training examples","To calculate final test accuracy"],
 answer:0,
 explanation:"The neighborhood function determines how strongly neurons near the BMU are updated. This helps SOM preserve topology."
},
{
 question:"What does SOM primarily preserve when mapping high-dimensional data onto a 2D grid?",
 options:["Neighborhood relationships","Original image resolution","Original number of dimensions","Original order of the dataset"],
 answer:0,
 explanation:"SOM attempts to preserve neighborhood relationships, so similar input patterns tend to appear close together on the map."
},
{
 question:"Which is a common application of SOM?",
 options:["Data visualization and clustering","Only database storage","Only operating-system scheduling","Only file compression"],
 answer:0,
 explanation:"SOM is commonly used for clustering, pattern discovery, dimensionality reduction, and visualization of multidimensional data."
},
{
 question:"What generally happens to the SOM learning rate as training progresses?",
 options:["It gradually decreases","It always increases","It remains infinite","It is unrelated to training"],
 answer:0,
 explanation:"The learning rate generally decreases during training, allowing large adjustments initially and finer adjustments later."
}
];

let currentQuestion=0;
let score=0;
let answered=false;

const questionNumber=document.getElementById("questionNumber");
const question=document.getElementById("question");
const options=document.getElementById("options");
const feedback=document.getElementById("feedback");
const answerTitle=document.getElementById("answerTitle");
const explanation=document.getElementById("explanation");
const nextBtn=document.getElementById("nextBtn");
const progressBar=document.getElementById("progressBar");
const quizArea=document.getElementById("quizArea");
const result=document.getElementById("result");
const scoreDisplay=document.getElementById("score");
const resultMessage=document.getElementById("resultMessage");
const restartBtn=document.getElementById("restartBtn");

function loadQuestion(){
    answered=false;
    const q=quiz[currentQuestion];

    questionNumber.textContent="Question "+(currentQuestion+1)+" of "+quiz.length;
    question.textContent=q.question;
    options.innerHTML="";
    feedback.classList.remove("show");
    nextBtn.style.display="none";
    progressBar.style.width=((currentQuestion)/quiz.length*100)+"%";

    q.options.forEach((option,index)=>{
        const button=document.createElement("button");
        button.className="option";
        button.textContent=String.fromCharCode(65+index)+". "+option;
        button.onclick=()=>checkAnswer(index,button);
        options.appendChild(button);
    });
}

function checkAnswer(selectedIndex,selectedButton){
    if(answered)return;
    answered=true;

    const q=quiz[currentQuestion];
    const allButtons=document.querySelectorAll(".option");

    allButtons.forEach(button=>button.disabled=true);

    if(selectedIndex===q.answer){
        score++;
        selectedButton.classList.add("correct");
        answerTitle.textContent="✓ Correct Answer";
    }else{
        selectedButton.classList.add("wrong");
        allButtons[q.answer].classList.add("correct");
        answerTitle.textContent="✗ Correct Answer";
    }

    explanation.textContent=q.explanation;
    feedback.classList.add("show");
    nextBtn.style.display="block";

    if(currentQuestion===quiz.length-1){
        nextBtn.textContent="View Result";
    }

    progressBar.style.width=((currentQuestion+1)/quiz.length*100)+"%";
}

function nextQuestion(){
    currentQuestion++;
    if(currentQuestion<quiz.length){
        loadQuestion();
    }else{
        showResult();
    }
}

function showResult(){
    quizArea.style.display="none";
    result.style.display="block";
    restartBtn.style.display="block";

    scoreDisplay.textContent=score+" / "+quiz.length;

    const percentage=Math.round((score/quiz.length)*100);

    if(percentage>=80){
        resultMessage.textContent="Excellent! You have a strong understanding of SOM.";
    }else if(percentage>=60){
        resultMessage.textContent="Good work! Review a few SOM concepts and try again.";
    }else{
        resultMessage.textContent="Keep practicing! Review BMU, neighborhood function, and SOM training.";
    }
}

function restartQuiz(){
    currentQuestion=0;
    score=0;
    result.style.display="none";
    quizArea.style.display="block";
    loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
